schema_version: 1

context:
  version: "1.9.0"

package:
  name: python-discovery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-discovery/python_discovery-${{ version }}.tar.gz
  sha256: 88beb57e51b919c30f303b053ec41359298ca349192035b0a802c76347ae96d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.28
    - pip
  run:
    - python >=${{ python_min }}
    - filelock >=3.16.1
tests:
  - python:
      imports:
        - python_discovery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python interpreter discovery
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tox-dev/python-discovery
  repository: https://github.com/tox-dev/python-discovery
  documentation: https://python-discovery.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
